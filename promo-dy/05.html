<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body class="solve">
  <div class="head">
    <div class="tag">DSH · 踩坑实录</div>
    <div class="page">5/6</div>
  </div>

  <div class="body">
    <div style="font-size:34px;color:#6e7b8b;letter-spacing:.1em;font-weight:700;margin-bottom:42px;">怎么装</div>

    <div style="border:2px solid #262d38;border-radius:24px;background:#0f1319;padding:50px 46px;">
      <div style="font-size:27px;color:#5c6675;margin-bottom:28px;letter-spacing:.06em;">在仓库目录里跑这一行</div>
      <div class="mono" style="font-size:40px;line-height:1.45;color:#7ee787;">node install.mjs</div>
      <div style="height:2px;background:#1d232c;margin:36px 0 32px;"></div>
      <div style="font-size:28px;color:#8b949e;line-height:1.85;">
        自动装进你的 profile<br>
        自动跑完 17 项自测<br>
        重启 DSH 就生效
      </div>
    </div>

    <div class="sub" style="font-size:35px;margin-top:54px;">
      装错了想撤：<span class="mono" style="color:#9aa7b6;font-size:33px;">node install.mjs --uninstall</span>
    </div>
    <div style="font-size:31px;color:#5c6675;margin-top:22px;line-height:1.6;">
      不用手动改任何配置文件。
    </div>
  </div>

  <div class="foot">仓库地址在最后一张</div>
</body>
